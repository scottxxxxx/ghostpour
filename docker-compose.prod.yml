services:
  ghostpour:
    image: ghcr.io/scottxxxxx/ghostpour:latest
    container_name: ghostpour
    restart: unless-stopped
    expose:
      - "8000"
    volumes:
      - ghostpour-data:/app/data
    env_file:
      - .env.prod
    networks:
      - proxy-tier
    # Send container logs to journald so they survive `docker compose
    # up -d` recreates on every deploy. Default json-file driver writes
    # to /var/lib/docker/containers/<id>/<id>-json.log which is deleted
    # when the container is removed — that wiped a hung-request
    # request_id during the 2026-04-27 incident. Query via:
    #   journalctl CONTAINER_NAME=ghostpour --since '...' --until '...'
    logging:
      driver: journald
      options:
        tag: ghostpour
    # Added 2026-08-22 so `up -d --wait` in the deploy job can tell a
    # started container from a working one. It does NOT close the traffic
    # gap and is not meant to: `up -d` stops the old container before
    # starting the new one, so the socket is dead for the same 10 to 40 s
    # either way, and the edge retry Bifrost shipped is what covers that.
    # What this buys is that a deploy which brings up a container that
    # never becomes healthy FAILS the job instead of exiting 0 and leaving
    # prod down with a green tick in Actions.
    #
    # python rather than curl on purpose: curl is not in this image, and a
    # healthcheck whose binary is missing reports unhealthy forever, which
    # would turn `--wait` into a guaranteed deploy failure. Verified by
    # running this exact command inside the running prod container.
    #
    # /health is cheap and does not touch the database, so a 10 s interval
    # costs nothing. start_period covers boot: config hydration and the
    # retention sweep both run at startup, and failures during it do not
    # count against `retries`.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=3).status == 200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 40s

  # Continuous SQLite → GCS replication for DR. Reads the same data
  # volume as the GhostPour app and streams WAL frames to a GCS bucket
  # configured in litestream.yml.
  #
  # Auth: VM's metadata-service identity (Compute Engine default SA).
  # The VM has cloud-platform OAuth scope and the SA has objectAdmin
  # on the replication bucket — google-cloud-storage SDK inside the
  # litestream binary picks this up via Application Default Creds.
  # No key file on disk = no long-lived credentials to leak or rotate.
  #
  # Restore runbook: ghostpour-ops/docs/disaster-recovery.md.
  litestream:
    image: litestream/litestream:0.3.13
    container_name: ghostpour-litestream
    restart: unless-stopped
    volumes:
      - ghostpour-data:/data
      - ./litestream.yml:/etc/litestream.yml:ro
    command: replicate -config /etc/litestream.yml
    depends_on:
      - ghostpour
    logging:
      driver: journald
      options:
        tag: ghostpour-litestream

volumes:
  ghostpour-data:

networks:
  proxy-tier:
    external: true
