<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>N-400 Helper</title>
<!--
  GP promo creative, render=html, app_id=n400, placement=n400_share (the
  auditor's contract, 2026-10-13). N-400 Helper shows it INLINE on the Form
  screen in a transparent web view sized to this page's height, so the body
  is transparent, the page has no fixed height, and it fits 360pt wide.
  One file per language; GP picks the file from the app's Accept-Language
  through the campaign's content_locales, so there is no script at all.

  Link convention: every link carries promo_cta_id (counted as a click). A
  link that ALSO carries promo_action=share opens the iOS share sheet with
  this URL after the client strips the promo_* params; any other link opens
  outside the app. The share target is the website until the App Store
  listing exists; change it here with a creative upload, no app release.
  No dashes as punctuation in the copy (Scott's rule).
-->
<style>
  :root {
    --ink: #0b1220; --ink2: rgba(11,18,32,.66); --edge: rgba(255,255,255,.85);
    --btn: #0b1220; --btnText: #fff; --a: rgba(18,160,94,.14); --b: rgba(13,99,232,.12);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #f4f7fc; --ink2: rgba(235,240,250,.66); --edge: rgba(255,255,255,.18);
      --btn: #f4f7fc; --btnText: #0b1220; --a: rgba(63,208,138,.14); --b: rgba(92,157,251,.12);
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: transparent; }
  body { font: 16px/1.4 -apple-system, BlinkMacSystemFont, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  .card { padding: 18px; border-radius: 22px; background: linear-gradient(135deg, var(--a), var(--b)); border: .5px solid var(--edge); }
  h1 { margin: 0 0 6px; font-size: 19px; font-weight: 700; letter-spacing: -.3px; color: var(--ink); }
  p { margin: 0 0 14px; font-size: 14px; line-height: 1.4; color: var(--ink2); }
  a.btn { display: inline-flex; align-items: center; gap: 8px; padding: 12px 18px; border-radius: 999px; background: var(--btn); color: var(--btnText); font-size: 15px; font-weight: 600; text-decoration: none; }
  a.btn:active { opacity: .85; }
</style>
</head>
<body>
  <main class="card">
  <h1>Conhece alguém se preparando para a cidadania?</h1>
  <p>Envie o app para essa pessoa. Você já fez a parte difícil; ela também não deveria ter que adivinhar onde vão as respostas.</p>
  <a class="btn" href="https://n400helper.com/?promo_cta_id=share_n400&amp;promo_action=share" data-cta-id="share_n400"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="M7 8l5-5 5 5"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg><span>Compartilhar o N-400 Helper</span></a>
  </main>
</body>
</html>
