# =============================================================================
# App registry — the single source of truth for which iOS apps GhostPour
# serves and where each app's client-fetched config lives.
#
# Identity arrives on the wire as the `X-App-ID` request header (set into
# `request.state.app_id` by request_logging middleware). Config resolution
# (app/routers/config.py get_config) and the admin dashboard both read this
# registry.
#
# Resolution contract (Phase B / #249) — ALWAYS fails open:
#   - Missing / blank / "unknown" X-App-ID  -> `default_app` (shouldersurf).
#     A header-less client is ShoulderSurf by definition.
#   - Known id (case-insensitive) -> serve from that app's `dir` (with flat
#     fallback during the B2 migration; see config.py).
#   - UNRECOGNIZED id -> default_app too, with a logged warning. ShoulderSurf
#     has months of TestFlight builds in the field; we never break their
#     config fetch over an unexpected app id. Register new apps here before
#     launch so they get their own dir instead of the fallback.
#
# `dir` is the subdirectory under config/remote/ (bundle) and the persistent
# remote-config dir (overlay) that holds this app's files. Until Phase B2
# moves files, the dirs are empty and resolution falls back to today's flat
# filenames, so adding this registry changes nothing on its own.
# =============================================================================

default_app: shouldersurf

apps:
  shouldersurf:
    dir: shouldersurf
    label: ShoulderSurf
    # Apple bundle id — the key into config/app-versions.yml. The force-upgrade
    # version gate (app/services/version_gate.py) resolves X-App-ID -> this -> the
    # app's version floor. No bundle_id => the gate can't resolve a floor and
    # fails open (never blocks).
    bundle_id: com.shouldersurf.ShoulderSurf
    # Per-app CQ identity (#cq). SS moves off the shared default cq_app_id
    # onto its own CQ app (886a527b) so CQ resolves the SS schema/prompt
    # rather than the universal fallback. Same mechanism as
    # techrehearsal.cq below; secret lives in Secret Manager
    # (ss-cq-client-secret, provisioned 2026-08-11). NOTE: deploying this
    # block IS the identity flip — merge only inside the agreed window,
    # with CQ watching their worker logs.
    cq:
      app_id: "886a527b-1d8f-46e1-aadc-d4b05e16256e"
      secret_setting: ss_cq_client_secret
  techrehearsal:
    dir: techrehearsal
    label: Tech Rehearsal
    bundle_id: com.weirtech.techrehearsal
    # Per-app CQ identity (#cq). TR is a separate ContextQuilt app with its own
    # CQ app_id, so its writes must reach CQ tagged as bc6efb4c (not the default
    # ShoulderSurf/ghostpour identity) or CQ validates them against the wrong
    # schema. GP authenticates to CQ as this app using `secret_setting` (resolved
    # from Secret Manager, empty until CQ provisions it). See
    # app/services/context_quilt.py _cq_identity().
    cq:
      app_id: "bc6efb4c-2854-49c0-9e8d-437c99610588"
      secret_setting: tr_cq_client_secret
    # Per-app budget gate (#249, app/services/tr_budget.py). DORMANT until
    # `enabled: true`. TR free/paid is the X-TR-Entitlement header, independent
    # of the SS tier; caps are USD spend per UTC calendar month, summed from
    # this user's techrehearsal usage_log rows. ENABLED 2026-07-05: TR's
    # cutover build (tr-2026-06-30-match-cutover-1 on X-TR-Build) verified live
    # in the field with X-TR-Entitlement on every call.
    budget:
      enabled: true
      monthly_cost_limit_usd:
        free: 5.0
        paid: 25.0
    # Per-app tier overrides (#249): values that REPLACE the user's SS-tier
    # value when X-App-ID resolves to this app. TR users share the SS user row,
    # so their tier (e.g. pro) carries SS defaults; these scope app-specific
    # caps without editing the shared tiers.yml. Applied ONLY for
    # app_id=techrehearsal — SS (shouldersurf / no header) is never touched.
    tier_overrides:
      max_images_per_request: 1   # TR live-interview single-shot cap (TR ask 2026-06-23; tunable)
  n400:
    dir: n400
    label: N-400 Helper
    bundle_id: com.weirtech.n400helper
    # Registered 2026-08-31, BEFORE the first TestFlight, which is the whole
    # point: resolve_app_dir fails open, so an unregistered id would have been
    # served ShoulderSurf's config with only a log line and nothing would have
    # errored. `n400` was already pinned on the client side (their
    # BACKEND-CONTRACTS.md and GPGateway.appID) before we wrote this, so the
    # string is theirs, not ours, and it is permanent once a build ships.
    #
    # NO `budget` BLOCK AND NO `tier_overrides`, deliberately, and the reason
    # is worth reading before adding one. N-400's paid tier is a StoreKit
    # non-consumable (com.weirtech.n400helper.case) gated ENTIRELY on the
    # client, per case. Nothing about it reaches GP, so there is no per-call
    # entitlement for a gate to read and the `budget` mechanism (which is
    # entitlement-keyed) has nothing to key on.
    #
    # ⚠ THAT IS NOT THE SAME AS "N-400 SPEND IS FREE". usage_tracker
    # .record_cost does `UPDATE users SET monthly_used_usd = ... WHERE id = ?`
    # with NO app scoping, and the account row is shared across every app
    # under this developer team. So an N-400 call draws down the SAME monthly
    # allowance the user's ShoulderSurf tier grants, and a heavy N-400 user on
    # SS free can exhaust their ShoulderSurf allowance without ever opening
    # ShoulderSurf. That is leak 2 of docs/design/per-app-tenancy-and-
    # entitlement.md, arriving concretely rather than theoretically. Fixing it
    # is the generalized per-app budget gate in that doc, not a line here.
    #
    # No `cq` block: N-400 has not asked for ContextQuilt, so it stays on the
    # default identity rather than being handed one it does not use.
