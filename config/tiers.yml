# =============================================================================
# GhostPour Subscription Tiers — SINGLE SOURCE OF TRUTH
#
# This file drives:
#   1. Server-side enforcement (model access, rate limits, quotas)
#   2. iOS app display via GET /v1/tiers (descriptions, feature_bullets, gating)
#   3. iOS app constraints via GET /v1/usage/me (summary, images, features)
#
# Feature gating uses three states (defined in features.yml):
#   enabled  — Feature fully active (check + apply)
#   teaser   — Run check, return metadata, don't apply (for upgrade nudges)
#   disabled — Don't run at all
#
# Field reference (see private ops repo for tier economics rationale):
#   monthly_cost_limit_usd  — per-user per-month spend cap. -1 = unlimited.
#   trial_cost_limit_usd    — temporary cap during free-trial window.
#   daily_cost_limit_usd    — per-day spend cap. -1 = unlimited.
#   daily_token_limit       — per-day token cap. -1 = unlimited.
#   requests_per_minute     — rate limit.
#   summary_mode            — "delta" or "choice" (full or delta).
#   summary_interval_minutes
#   allowed_providers       — provider names; "*" allows all.
#   allowed_models          — model identifiers; "*" allows all.
#   max_images_per_request
#   hours_per_month         — display value (cost-enforced under the hood).
#   storekit_product_id     — App Store product ID for purchase mapping.
#   features                — per-feature state (enabled/teaser/disabled).
#   feature_bullets         — display strings for the upgrade page.
#
# On tier upgrade: unused allocation carries forward as dollar value.
# =============================================================================

tiers:
  free:
    display_name: "Free"
    description: "Try AI-powered meeting assistance with a small free credit."
    default_model: "anthropic/claude-haiku-4-5-20251001"
    # GA cap (Scott 2026-07-27): $1.00/month, deliberately never expressed
    # as hours anywhere user-facing. The served copy promises only "a
    # monthly allowance of AI credits", so this is a silent dial: users
    # see 10,000 credits and however far that goes. History: $0.35 at
    # launch of the beta, raised 5x to $1.75 for TestFlight testers,
    # settled here at GA (nobody was above $0.15 MTD at the change).
    monthly_cost_limit_usd: 1.00
    daily_cost_limit_usd: -1
    daily_token_limit: -1
    requests_per_minute: 5
    summary_mode: "delta"
    summary_interval_minutes: 10
    allowed_providers:
      - "anthropic"
    allowed_models:
      - "claude-haiku-4-5-20251001"
    max_images_per_request: 1
    hours_per_month: 5
    # Project Chat context cap (chars/4 heuristic; matches iOS fuel gauge).
    # Free: ~3-4 meetings of context. iOS blocks send client-side; server
    # returns 413 + context_too_large CTA as defense in depth.
    max_input_tokens: 50000
    storekit_product_id: ""
    feature_bullets:
      - "A monthly allowance of AI credits, enough for regular use"
      - "Real-time auto-summaries"
      - "On-device transcription (unlimited)"
      - "1 image per query"

  plus:
    display_name: "Plus"
    description: "Unlimited AI-powered meeting assistance. Summaries, reports, and project chat."
    default_model: "anthropic/claude-haiku-4-5-20251001"
    monthly_cost_limit_usd: -1
    trial_cost_limit_usd: 2.40
    daily_cost_limit_usd: -1
    daily_token_limit: -1
    requests_per_minute: 20
    summary_mode: "delta"
    summary_interval_minutes: 10
    allowed_providers:
      - "anthropic"
    allowed_models:
      - "claude-haiku-4-5-20251001"
    max_images_per_request: 3
    hours_per_month: -1
    # Plus context cap — guardrail against accidental "attach everything"
    # footguns. Plus has unlimited budget so this isn't a cost gate.
    max_input_tokens: 150000
    storekit_product_id: "com.weirtech.shouldersurf.sub.plus.monthly"
    feature_bullets:
      - "Unlimited meetings with AI assistance"
      - "Standard AI"
      - "Real-time auto-summaries"
      - "Shareable meeting reports"
      - "Project chat across meetings"
      - "3 images per query"

  pro:
    display_name: "Pro"
    description: "Everything in Plus with advanced AI for deeper reports and real file generation."
    default_model: "anthropic/claude-haiku-4-5-20251001"
    monthly_cost_limit_usd: -1
    trial_cost_limit_usd: 5.10
    daily_cost_limit_usd: -1
    daily_token_limit: -1
    requests_per_minute: 30
    summary_mode: "choice"
    summary_interval_minutes: 10
    allowed_providers:
      - "anthropic"
    allowed_models:
      - "claude-haiku-4-5-20251001"
      - "claude-sonnet-4-6"
    max_images_per_request: 5
    hours_per_month: -1
    # Pro context cap — slightly under model context window for system-prompt
    # headroom. Pro reports run on Sonnet; cost variance absorbed by unlimited
    # budget at this tier.
    max_input_tokens: 180000
    storekit_product_id: "com.weirtech.shouldersurf.sub.pro.monthly"
    feature_bullets:
      - "Unlimited meetings with AI assistance"
      - "Advanced AI for reports and analysis"
      - "Full or delta summaries (your choice)"
      - "Shareable meeting reports"
      - "Project chat across meetings"
      - "Meeting Memory: AI remembers past meetings"
      - "5 images per query"

  # Automation credentials for partner test harnesses. NOT a customer tier:
  # it exists so a long-lived token cannot be mistaken for a paying user in
  # billing or analytics, and so it carries a REAL ceiling. Plus, Pro and
  # admin are all cost-unlimited (-1), so an automation account on any of
  # them would have no cap at all, which is the whole thing we are bounding.
  # Entitlements and model routing mirror Pro, so a harness exercises the
  # same lane a paying user gets rather than a synthetic one.
  automation:
    display_name: "Automation (internal)"
    description: "Partner test harness credentials. Capped, revocable, not a customer."
    default_model: "anthropic/claude-sonnet-4-6"
    # Raised 2.0 -> 10.0 on 2026-08-17, and the reason is measured. The
    # $2 ceiling was set before anything on this account had built a
    # file, and a single freeform file build costs about a dollar
    # (measured same day: $0.91 and $1.06). So $2 bought one build plus
    # change, and one end-to-end verification of the generation path
    # consumed the entire month and blocked the harness the tier exists
    # to serve. A ceiling that stops the thing it is meant to permit is
    # the wrong ceiling.
    #
    # Still a REAL ceiling, which is the whole point of the tier: plus,
    # pro and admin are all -1, so this account cannot be moved onto one
    # of them instead. Ten dollars is roughly ten builds a month, which
    # covers a harness plus the occasional live check with room to
    # notice if something starts looping.
    monthly_cost_limit_usd: 10.0
    daily_cost_limit_usd: -1
    daily_token_limit: -1
    requests_per_minute: 20
    summary_mode: "choice"
    summary_interval_minutes: 10
    allowed_providers:
      - "*"
    allowed_models:
      - "*"
    max_images_per_request: 5
    hours_per_month: -1
    storekit_product_id: ""
    feature_bullets:
      - "Internal automation credential"
  admin:
    display_name: "Admin"
    description: "Internal admin tier — unlimited access."
    default_model: "anthropic/claude-sonnet-4-6"
    monthly_cost_limit_usd: -1
    daily_cost_limit_usd: -1
    daily_token_limit: -1
    requests_per_minute: 120
    summary_mode: "choice"
    summary_interval_minutes: 10
    allowed_providers:
      - "*"
    allowed_models:
      - "*"
    max_images_per_request: 10
    hours_per_month: -1
    storekit_product_id: ""
    feature_bullets:
      - "Unlimited AI assistance"
      - "All models and providers"
      - "Meeting Memory"
